[project]
name = "satya-blindgen"
version = "0.1.0"
description = "Independent blind test set generator and evaluator for SATYA-EoA (synthetic data only)"
requires-python = ">=3.12"
dependencies = [
  "satya-affidavit",
  "satya-forensics",
  "pyyaml>=6",
  "reportlab==5.0.1",
]

[tool.uv.sources]
satya-affidavit = { workspace = true }
satya-forensics = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satya_blindgen"]
