[project]
name = "satya-shared-types"
version = "0.1.0"
description = "Pydantic v2 models generated from packages/shared-types/schemas (do not edit generated code)"
requires-python = ">=3.12"
dependencies = [
    "jsonschema==4.26.0",
    "pydantic==2.14.1",
    "rfc3339-validator==0.1.4",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["satya_shared_types"]
