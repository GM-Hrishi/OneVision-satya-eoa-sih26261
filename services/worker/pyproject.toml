[project]
name = "satya-worker"
version = "0.1.0"
description = "SATYA-EoA Celery worker on Valkey. Feature tasks arrive in later slices."
requires-python = ">=3.12"
dependencies = [
    "celery[redis]==5.6.3",
    "pikepdf==10.17.0",
    "pyhanko==0.38.0",
    "redis==6.4.0",
    "satya-shared-types",
]

[tool.uv.sources]
satya-shared-types = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satya_worker"]
