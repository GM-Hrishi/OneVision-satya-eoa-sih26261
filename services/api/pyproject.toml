[project]
name = "satya-api"
version = "0.1.0"
description = "SATYA-EoA gateway (FastAPI). Advisory decision support; synthetic data only."
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.16.1",
    "pyjwt[crypto]==2.15.1",
    "python-ulid==4.0.1",
    "redis==6.4.0",
    "satya-affidavit",
    "satya-forensics",
    "satya-ocr",
    "satya-shared-types",
    "sqlalchemy[asyncio]==2.1.6",
    "uvicorn[standard]==0.54.0",
]

[tool.uv.sources]
satya-shared-types = { workspace = true }
satya-affidavit = { workspace = true }
satya-forensics = { workspace = true }
satya-ocr = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satya_api"]
